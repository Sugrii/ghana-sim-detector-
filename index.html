<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghana SIM & Mobile Money Name Detector</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #e2e8f0;
            --mtn-color: #ffcc00;
            --telecel-color: #e60000;
            --at-color: #0055a5;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h2 {
            color: var(--text-main);
            font-size: 1.4rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="tel"] {
            width: 100%;
            padding: 0.85rem 1rem;
            padding-right: 4.5rem;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="tel"]:focus {
            border-color: #3182ce;
        }

        .network-badge {
            position: absolute;
            right: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
            display: none;
            color: #fff;
        }

        .network-mtn { background-color: var(--mtn-color); color: #000; display: block; }
        .network-telecel { background-color: var(--telecel-color); display: block; }
        .network-at { background-color: var(--at-color); display: block; }

        .result-box {
            background-color: #f8fafc;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 1rem;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }

        .result-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
        }

        .status-loader {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.8rem;
            margin-top: 0.4rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Ghana Name Lookup</h2>
        <p>Auto-detect network & registered identity</p>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
            <input type="tel" id="phone" placeholder="024XXXXXXX" maxlength="10" autocomplete="off">
            <span id="networkBadge" class="network-badge"></span>
        </div>
        <div id="errorMessage" class="error-message">Enter a valid 10-digit Ghanaian number.</div>
    </div>

    <div class="result-box">
        <div class="result-title">Registered Name</div>
        <div id="resultName" class="result-name">Enter phone number above...</div>
    </div>
</div>

<script>
    const phoneInput = document.getElementById('phone');
    const networkBadge = document.getElementById('networkBadge');
    const resultName = document.getElementById('resultName');
    const errorMessage = document.getElementById('errorMessage');

    // Ghana Telecom Prefixes
    const NETWORKS = {
        MTN: ['024', '054', '055', '059', '025', '053'],
        TELECEL: ['020', '050'],
        AIRTELTIGO: ['026', '056', '027', '057']
    };

    let debounceTimer;

    phoneInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        e.target.value = value;

        clearTimeout(debounceTimer);
        resetUI();

        if (value.length >= 3) {
            const network = detectNetwork(value.substring(0, 3));
            updateNetworkBadge(network);
        }

        if (value.length === 10) {
            if (isValidGhanaNumber(value)) {
                errorMessage.style.display = 'none';
                resultName.innerHTML = '<span class="status-loader">Querying network database...</span>';
                
                debounceTimer = setTimeout(() => {
                    fetchRegisteredName(value);
                }, 400);
            } else {
                showError('Invalid prefix for Ghanaian networks.');
            }
        }
    });

    function detectNetwork(prefix) {
        if (NETWORKS.MTN.includes(prefix)) return { name: 'MTN', class: 'network-mtn' };
        if (NETWORKS.TELECEL.includes(prefix)) return { name: 'Telecel', class: 'network-telecel' };
        if (NETWORKS.AIRTELTIGO.includes(prefix)) return { name: 'AT', class: 'network-at' };
        return null;
    }

    function updateNetworkBadge(network) {
        if (network) {
            networkBadge.textContent = network.name;
            networkBadge.className = `network-badge ${network.class}`;
        } else {
            networkBadge.className = 'network-badge';
        }
    }

    function isValidGhanaNumber(number) {
        const prefix = number.substring(0, 3);
        return detectNetwork(prefix) !== null;
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
        resultName.textContent = '---';
    }

    function resetUI() {
        errorMessage.style.display = 'none';
        if (phoneInput.value.length < 10) {
            resultName.textContent = 'Waiting for full number...';
        }
        if (phoneInput.value.length < 3) {
            networkBadge.className = 'network-badge';
        }
    }

    // Call Local Node.js Backend Endpoint
    // Replace with your actual deployed Vercel backend URL
const BACKEND_URL = 'https://ghana-sim-detect-backend.vercel.app/api/resolve-name';

async function fetchRegisteredName(phoneNumber) {
    try {
        const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ phone: phoneNumber })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            resultName.textContent = data.account_name;
        } else {
            resultName.textContent = data.message || 'Identity not found';
        }
    } catch (error) {
        console.error('Frontend Error:', error);
        resultName.textContent = 'Failed to connect to backend service';
    }
}
</script>
</body>
</html>
